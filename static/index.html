<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
  :root { --bg:#0b1020; --panel:#121a2e; --line:#1f2b47; --text:#e6edf7; --dim:#8a97b2; --accent:#4cc9f0; --ok:#3ddc97; --bad:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font:16px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:16px; }
  h1 { margin:0; font-size:18px; letter-spacing:6px; color:var(--accent); }
  .spacer { flex:1; }
  header label { font-size:13px; color:var(--dim); cursor:pointer; }
  #status { font-size:13px; color:var(--dim); }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 14px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  #mic.on { border-color:var(--bad); color:var(--bad); }
  #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:min(720px,88%); padding:10px 14px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; }
  .you { align-self:flex-end; background:#1b3a5c; }
  .jarvis { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .sys { align-self:center; color:var(--dim); font-size:13px; }
  #bar { padding:14px 20px; border-top:1px solid var(--line); display:flex; gap:10px; }
  #input { flex:1; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:12px 14px; font:inherit; }
  #input:focus { outline:none; border-color:var(--accent); }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; align-items:center; justify-content:center; padding:20px; }
  #modal.show { display:flex; }
  .card { background:var(--panel); border:1px solid var(--accent); border-radius:14px; padding:20px; width:min(640px,100%); }
  .card h2 { margin:0 0 10px; font-size:16px; color:var(--accent); }
  #question { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px; white-space:pre-wrap; word-wrap:break-word; font:14px/1.45 Consolas, monospace; max-height:50vh; overflow:auto; }
  .row { display:flex; gap:10px; margin-top:16px; justify-content:flex-end; }
  #approve { border-color:var(--ok); color:var(--ok); }
  #deny { border-color:var(--bad); color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>JARVIS</h1>
  <span id="status"></span>
  <span class="spacer"></span>
  <label><input type="checkbox" id="speak" checked> speak replies</label>
  <button id="reset">New chat</button>
</header>
<div id="log"></div>
<div id="bar">
  <input id="input" placeholder="Talk to JARVIS..." autocomplete="off" autofocus>
  <button id="mic" title="Speak">Mic</button>
  <button id="send">Send</button>
</div>
<div id="modal">
  <div class="card">
    <h2>JARVIS needs your approval</h2>
    <div id="question"></div>
    <div class="row">
      <button id="deny">Deny</button>
      <button id="approve">Approve</button>
    </div>
  </div>
</div>
<script>
const TOKEN = "__TOKEN__";
const $ = id => document.getElementById(id);
const log = $("log"), input = $("input"), modal = $("modal");
let busy = false, shownId = null, lastAnswered = null;

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function api(path, body) {
  const opts = { headers: { "X-Token": TOKEN } };
  if (body !== undefined) {
    opts.method = "POST";
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(path + " -> " + r.status);
  return r.json();
}

function speak(text) {
  if (!$("speak").checked || !("speechSynthesis" in window)) return;
  const clean = text.replace(/[*_`#>]+/g, "").replace(/\s+/g, " ").trim();
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = "en-US";
  const v = speechSynthesis.getVoices().find(v => v.lang === "en-US");
  if (v) u.voice = v;
  u.rate = 0.95;
  speechSynthesis.speak(u);
}

function showConfirm(p) {
  if (shownId === p.id || lastAnswered === p.id) return;
  shownId = p.id;
  $("question").textContent = p.question;
  modal.classList.add("show");
}
function hideConfirm() { shownId = null; modal.classList.remove("show"); }
async function answer(approve) {
  const id = shownId;
  lastAnswered = id;
  hideConfirm();
  if (id) await api("/api/confirm", { id: id, approve: approve });
}

async function poll() {
  while (true) {
    const s = await api("/api/poll");
    if (s.pending) showConfirm(s.pending); else hideConfirm();
    if (s.status === "done") { add("jarvis", s.reply); speak(s.reply); return; }
    if (s.status === "idle") return;
    await sleep(500);
  }
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  input.value = "";
  add("you", text);
  busy = true;
  $("status").textContent = "thinking...";
  try { await api("/api/chat", { text: text }); await poll(); }
  catch (e) { add("sys", "Error: " + e.message); }
  busy = false;
  $("status").textContent = "";
  input.focus();
}

$("send").onclick = send;
input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
$("approve").onclick = () => answer(true);
$("deny").onclick = () => answer(false);
$("reset").onclick = async () => {
  try { await api("/api/reset", {}); log.innerHTML = ""; add("sys", "New conversation."); }
  catch (e) { add("sys", "Can't reset right now: " + e.message); }
};

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SR) {
  $("mic").style.display = "none";
} else {
  const rec = new SR();
  rec.lang = "en-US";
  rec.interimResults = false;
  rec.onresult = e => { input.value = e.results[0][0].transcript; send(); };
  rec.onend = () => $("mic").classList.remove("on");
  rec.onerror = () => $("mic").classList.remove("on");
  $("mic").onclick = () => {
    if (busy) return;
    try { rec.start(); $("mic").classList.add("on"); } catch (e) {}
  };
}

add("jarvis", "Hello Boss. I am JARVIS. Type or use the mic.");
</script>
</body>
</html>
